services:
  - type: web
    name: harimart
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/v1/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: harimart-db
          property: connectionString

databases:
  - name: harimart-db
    plan: free
    databaseName: harimart
    user: harimart
